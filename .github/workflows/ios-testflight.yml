
name: Flutter iOS TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build and Upload iOS to TestFlight
    runs-on: macos-15

    steps:

      # 1. Checkout project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter 3.29.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      # 3. Check versions
      - name: Check Flutter and Xcode
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # 5. Install CocoaPods
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update
          cd ..

      # 6. Create temporary keychain
      - name: Create Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # 7. Import Apple Distribution Certificate
      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 -D \
            > "$RUNNER_TEMP/certificate.p12"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # 8. Install provisioning profile
      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE_BASE64" | base64 -D \
            > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print UUID" "$RUNNER_TEMP/profile.plist")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print Name" "$RUNNER_TEMP/profile.plist")

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Installed profile: $PROFILE_NAME"

      # 9. Validate Bundle ID and Team ID
      - name: Validate iOS Configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          if [ -z "$TEAM_ID" ]; then
            echo "APPLE_TEAM_ID is missing"
            exit 1
          fi

          if [ -z "$BUNDLE_ID" ]; then
            echo "IOS_BUNDLE_ID is missing"
            exit 1
          fi

          echo "Team ID configured"
          echo "Bundle ID: $BUNDLE_ID"

      # 10. Generate ExportOptions.plist
      - name: Create Export Options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

      # 11. Build signed IPA
      - name: Build iOS IPA
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      # 12. Find generated IPA
      - name: Locate IPA
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA file not found"
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          echo "Generated IPA: $IPA_PATH"

      # 13. Upload IPA as GitHub Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      # 14. Upload to TestFlight
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
